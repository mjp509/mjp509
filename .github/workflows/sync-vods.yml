name: Sync VODs

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: vod-data

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          T: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          if [ -n "$T" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Secrets not set yet, skipping sync"; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok

      - uses: actions/cache/restore@v4
        if: steps.check.outputs.ok
        with:
          path: .monitor
          key: monitor-none
          restore-keys: monitor-

      - name: Get TwitchDownloaderCLI
        if: steps.check.outputs.ok
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/lay295/TwitchDownloader/releases/latest \
            --jq '.assets[] | select(.name | test("CLI.*Linux-x64")) | .browser_download_url')
          curl -sL "$url" -o tdl.zip
          unzip -o tdl.zip -d tdl
          chmod +x tdl/TwitchDownloaderCLI

      - name: Sync
        if: steps.check.outputs.ok
        env:
          TDL: ${{ github.workspace }}/tdl/TwitchDownloaderCLI
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 vods/scripts/sync.py && python3 vods/scripts/stats.py

      - name: Commit
        if: steps.check.outputs.ok
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vods/site/data; [ -f vods/pending.json ] && git add vods/pending.json; [ -d vods/insights ] && git add vods/insights
          git commit -m "Sync VODs" || exit 0
          git push
