<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>itsmotch VODs</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="./"><img class="avatar" src="logo.svg" alt=""><b>itsmotch <span>VODs</span></b></a>
    <nav>
      <a href="./">All VODs</a>
      <a href="https://twitch.tv/itsmotch" target="_blank" rel="noopener">Twitch</a>
    </nav>
  </header>
  <div class="watch">
    <div class="left">
      <div class="player"><div id="yt"></div></div>
      <div class="activity" id="activity" hidden>
        <svg id="act-svg" preserveAspectRatio="none"></svg>
        <div class="act-head" id="act-head"></div>
        <div class="act-tip" id="act-tip" hidden></div>
      </div>
      <div class="details">
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
        <div class="actions"><button class="share" id="share" type="button">🔗 Share this moment</button></div>
        <p class="music-note">♪ Music is removed from VODs for copyright reasons.</p>
        <div class="chapters" id="chapters"></div>
        <div class="moments" id="moments" hidden><h2>Top moments</h2><div class="chapters" id="moment-list"></div></div>
      </div>
    </div>
    <aside class="chat">
      <div class="chat-head">Chat replay <span id="chat-status">Loading…</span></div>
      <div class="chat-log loading" id="log"></div>
    </aside>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="common.js"></script>
  <script src="vod.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
