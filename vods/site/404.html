  <link rel="icon" id="favicon" href="https://unavatar.io/twitch/itsmotch">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="logo"><a class="logo-ch" href="https://twitch.tv/itsmotch" target="_blank" rel="noopener" title="itsmotch on Twitch"><img class="avatar" id="avatar" alt=""><b>itsmotch</b></a> <a class="logo-home" href="/"><b><span>VODs</span></b></a></div>
    <nav class="site-nav"><a href="/" title="VODs" aria-label="VODs"><span class="ni" aria-hidden="true">📺</span><span class="nt">VODs</span></a><a href="/shinies.html" title="Shinies" aria-label="Shinies"><span class="ni" aria-hidden="true">✨</span><span class="nt">Shinies</span></a><a href="/osrs.html" title="OSRS" aria-label="OSRS"><span class="ni" aria-hidden="true">⚔️</span><span class="nt">OSRS</span></a><a href="/profile.html" title="Chatters" aria-label="Chatters"><span class="ni" aria-hidden="true">💬</span><span class="nt">Chatters</span></a></nav>
  </header>
  <main class="not-found">
    <div class="empty-state">
      <div class="empty-icon">🍔</div>
      <h1>This page doesn't exist</h1>
      <p>The link might be old or mistyped.</p>
      <a class="btn" href="/">Browse all VODs</a>
    </div>
  </main>
  <script>
    fetch("/data/channel.json").then(r => r.json()).then(c => {
      if (!c.avatar) return;
      const img = document.getElementById("avatar");
      if (img.hasAttribute("data-fixed")) { img.classList.add("spin"); } else { img.onload = () => img.classList.add("spin"); img.src = c.avatar; }
      document.getElementById("favicon").href = c.avatar;
    }).catch(() => document.getElementById("avatar").remove());
  </script>
</body>
</html>
