<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>itsmotch VODs</title>
  <meta name="description" content="Every itsmotch stream, with chat replay.">
  <link rel="icon" id="favicon" href="https://unavatar.io/twitch/itsmotch">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="./"><img class="avatar" id="avatar" alt=""><b>itsmotch <span>VODs</span></b></a>
    <nav>
      <a href="https://twitch.tv/itsmotch" target="_blank" rel="noopener">Twitch</a>
    </nav>
  </header>
  <main>
    <section class="live" id="live">
      <div class="live-head">
        <span class="live-dot"></span>
        <strong id="live-label">itsmotch on Twitch</strong>
        <a href="https://twitch.tv/itsmotch" target="_blank" rel="noopener">Open on Twitch ↗</a>
      </div>
      <div class="live-embed" id="twitch-embed"></div>
    </section>
    <section class="board" id="board" hidden>
      <div class="board-head">
        <button id="board-prev" aria-label="Previous month">‹</button>
        <h2>Top chatters · <span id="board-month"></span></h2>
        <button id="board-next" aria-label="Next month">›</button>
      </div>
      <div class="podium" id="podium"></div>
    </section>
    <div class="controls">
      <input id="q" type="search" placeholder="Search streams…">
      <div class="seg" id="sort">
        <button data-sort="recent" class="active">Recent</button>
        <button data-sort="popular">Popular</button>
      </div>
      <select id="game"><option value="">All games</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="site-foot">♪ Music is removed from VODs for copyright reasons.</footer>
  <script src="common.js"></script>
  <script src="index.js"></script>
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script src="live.js"></script>
  <script src="board.js"></script>
</body>
</html>
