<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>itsmotch VODs</title>
  <meta name="description" content="Every itsmotch stream, with chat replay.">
  <link rel="icon" id="favicon" href="https://unavatar.io/twitch/itsmotch">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo"><a class="logo-ch" href="https://twitch.tv/itsmotch" target="_blank" rel="noopener" title="itsmotch on Twitch"><img class="avatar" id="avatar" alt=""><b>itsmotch</b></a> <a class="logo-home" href="./"><b><span>VODs</span></b></a></div>
  </header>
  <main>
    <section class="live" id="live">
      <div class="live-embed" id="twitch-embed"></div>
      <div class="live-side">
        <div class="live-head"><span class="live-dot"></span><strong>LIVE NOW</strong></div>
        <p>itsmotch is streaming right now.</p>
        <a class="btn" href="https://twitch.tv/itsmotch" target="_blank" rel="noopener">Watch with chat on Twitch ↗</a>
      </div>
    </section>
    <section class="clips" id="continue" hidden>
      <h2>Continue watching</h2>
      <div class="clip-row" id="continue-row"></div>
    </section>
    <div class="controls">
      <input id="q" type="search" placeholder="Search streams…">
      <div class="seg" id="sort">
        <button data-sort="recent" class="active">Recent</button>
        <button data-sort="popular">Popular</button>
      </div>
      <select id="game"><option value="">All games</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><button class="more" id="more" type="button" hidden>Show more</button></div>
    <section class="clips" id="clips" hidden>
      <h2 id="clips-title">Top clips this month</h2>
      <div class="clip-row" id="clip-row"></div>
    </section>
    <section class="board" id="board" hidden>
      <div class="board-head">
        <button id="board-prev" aria-label="Previous month">‹</button>
        <h2 id="board-month"></h2>
        <button id="board-next" aria-label="Next month">›</button>
      </div>
      <div class="board-body">
        <div><div class="board-label">Top chatters</div><div class="podium" id="podium"></div></div>
        <div class="eotm-wrap" id="eotm-wrap"><div class="board-label">Emote of the month</div><div class="eotm" id="eotm"></div></div>
      </div>
    </section>
  </main>
  <div class="modal" id="clip-modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="clip-close" aria-label="Close">✕</button>
      <div class="modal-frame" id="clip-frame"></div>
    </div>
  </div>
  <footer class="site-foot">♪ Music is removed from VODs for copyright reasons ♪<br><a href="privacy.html">Privacy</a></footer>
  <script src="common.js"></script>
  <script src="index.js"></script>
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script src="live.js"></script>
  <script src="board.js"></script>
  <script src="clips.js"></script>
</body>
</html>
